baseURL = "https://v3n0.top/"
locale = "zh-CN"
title = "Veno's Blog"

theme = "hugo-theme-stack"

[[menu.social]]
name = "GitHub"
url = "https://github.com/U1traVeno"
weight = 1
params.icon = "brand-github"

[[menu.social]]
name = "bilibili"
url = "https://space.bilibili.com/199795377"
weight = 2
params.icon = "brand-bilibili"

[params]
mainSections = ["post"]

[params.homepage.pinned]
enabled = true
categoryArticleLimit = 3

[[params.homepage.pinned.items]]
type = "category"
value = "Paramer 开发记录"

# 单篇文章置顶示例：
# [[params.homepage.pinned.items]]
# type = "article"
# value = "/post/2026/hugo-stack-pinned-categories-and-articles/"
# label = "可选的自定义标题"

[params.sidebar]
subtitle = "Worse is better."
avatar.enabled = true
avatar.local = true
avatar.src = "avatar-veno.jpg"

[[params.widgets.homepage]]
type = "search"

[[params.widgets.homepage]]
type = "archives"

[[params.widgets.homepage]]
type = "categories"

[[params.widgets.homepage]]
type = "tag-cloud"

[[params.widgets.page]]
type = "toc"

[params.article]
math = true
readingTime = true
license.enabled = true

[params.comments]
enabled = true
provider = "giscus"


[params.comments.giscus]
enable = true
repo = "U1traVeno/U1traVeno.github.io"
repoId = "R_kgDONsVpmg"
category = "Blog Comments"
categoryId = "DIC_kwDONsVpms4Cs2Mk"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"
loading = "lazy"
crossorigin = "anonymous"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^DISCUSSION_TOKEN$']

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
style = "monokai"
lineNos = true
lineNumbersInTable = true
guessSyntax = true
codeFences = true
tabWidth = 4
