{{ define "main" }}
<main class="main">
    <div class="moments-wrapper">
        <div class="moments-header">
            <h1>{{ .Title }}</h1>
            {{ if .Description }}
            <p class="moments-description">{{ .Description }}</p>
            {{ end }}
        </div>

        <div id="moments-list" class="moments-list"></div>
        <div id="moments-loading" class="moments-loading">
            <span class="loading-spinner"></span>
            <span>加载中...</span>
        </div>
        <div id="moments-error" class="moments-error" style="display:none;"></div>
        <div id="moments-end" class="moments-end" style="display:none;">
            <span class="end-line"></span>
            <span class="end-text">到底了</span>
            <span class="end-line"></span>
        </div>
        <div id="moments-load-more" class="moments-load-more" style="display:none;">
            <button id="load-more-btn">加载更多</button>
        </div>
    </div>

    <style>
    .moments-wrapper {
        max-width: 680px;
        margin: 0 auto;
        padding: var(--main-top-padding) var(--container-padding);
    }

    .moments-header {
        margin-bottom: 2.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--card-separator-color);
    }

    .moments-header h1 {
        font-size: 2.4rem;
        font-weight: 600;
        color: var(--card-text-color-main);
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.02em;
    }

    .moments-description {
        font-size: 1.6rem;
        color: var(--card-text-color-secondary);
        margin: 0;
        line-height: 1.5;
    }

    /* Feed list */
    .moments-list {
        display: flex;
        flex-direction: column;
        gap: var(--section-separation);
    }

    /* Card */
    .moments-item {
        background: var(--card-background);
        border-radius: var(--card-border-radius);
        box-shadow: var(--shadow-l1);
        padding: var(--card-padding);
        transition: box-shadow 0.3s ease, transform 0.3s ease;
        animation: moments-enter 0.5s ease backwards;
    }

    .moments-item:hover {
        box-shadow: var(--shadow-l2);
        transform: translateY(-2px);
    }

    @keyframes moments-enter {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Staggered animation delay */
    .moments-item:nth-child(1) { animation-delay: 0s; }
    .moments-item:nth-child(2) { animation-delay: 0.08s; }
    .moments-item:nth-child(3) { animation-delay: 0.16s; }
    .moments-item:nth-child(4) { animation-delay: 0.24s; }
    .moments-item:nth-child(5) { animation-delay: 0.32s; }
    .moments-item:nth-child(6) { animation-delay: 0.40s; }
    .moments-item:nth-child(7) { animation-delay: 0.48s; }
    .moments-item:nth-child(8) { animation-delay: 0.56s; }
    .moments-item:nth-child(9) { animation-delay: 0.64s; }
    .moments-item:nth-child(10) { animation-delay: 0.72s; }

    /* Meta row */
    .moments-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--card-separator-color);
    }

    .moments-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid var(--card-separator-color);
        transition: border-color 0.2s ease;
        object-fit: cover;
    }

    .moments-item:hover .moments-avatar {
        border-color: var(--accent-color);
    }

    .moments-author {
        font-weight: 600;
        font-size: 1.5rem;
        color: var(--card-text-color-main);
        flex-grow: 1;
    }

    .moments-date {
        font-size: 1.3rem;
        color: var(--card-text-color-tertiary);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .moments-date svg {
        width: 14px;
        height: 14px;
        stroke-width: 1.5;
        opacity: 0.7;
    }

    /* Body content — matches Stack article typography */
    .moments-body {
        font-size: 1.6rem;
        color: var(--card-text-color-main);
        line-height: 1.75;
        word-break: break-word;
    }

    .moments-body > * + * {
        margin-top: 1.2em;
    }

    .moments-body p {
        margin: 0;
    }

    .moments-body h1,
    .moments-body h2,
    .moments-body h3,
    .moments-body h4,
    .moments-body h5,
    .moments-body h6 {
        margin: 1.5em 0 0.5em;
        font-weight: 600;
        line-height: 1.3;
        color: var(--card-text-color-main);
    }

    .moments-body h1 { font-size: 2em; }
    .moments-body h2 { font-size: 1.6em; }
    .moments-body h3 { font-size: 1.35em; }
    .moments-body h4 { font-size: 1.15em; }

    .moments-body strong { font-weight: 600; }
    .moments-body em { font-style: italic; }
    .moments-body del { text-decoration: line-through; color: var(--card-text-color-tertiary); }

    .moments-body a {
        color: var(--accent-color);
        text-decoration: none;
        transition: color 0.2s ease;
        border-bottom: 1px solid transparent;
    }

    .moments-body a:hover {
        color: var(--accent-color-darker);
        border-bottom-color: var(--accent-color-darker);
    }

    .moments-body img {
        max-width: 100%;
        height: auto;
        border-radius: var(--card-border-radius);
        margin-top: 1rem;
        display: block;
        box-shadow: var(--shadow-l1);
    }

    /* Inline code */
    .moments-body code {
        font-family: var(--code-font-family);
        font-size: 0.875em;
        background: var(--code-background-color);
        color: var(--code-text-color);
        padding: 2px 6px;
        border-radius: var(--tag-border-radius);
    }

    /* Code blocks — matches Stack theme (Monokai) */
    .moments-body pre {
        background: var(--pre-background-color);
        color: var(--pre-text-color);
        font-family: var(--code-font-family);
        font-size: 0.875em;
        line-height: 1.5;
        padding: var(--card-padding);
        border-radius: var(--card-border-radius);
        overflow-x: auto;
        margin: 1em 0;
    }

    .moments-body pre code {
        background: none;
        color: inherit;
        padding: 0;
        font-size: 1em;
        border-radius: 0;
    }

    /* Blockquote */
    .moments-body blockquote {
        margin: 1em 0;
        padding: 0.5em 0 0.5em 1.2em;
        border-left: 4px solid var(--card-separator-color);
        background: var(--blockquote-background-color);
        color: var(--card-text-color-secondary);
    }

    .moments-body blockquote p {
        margin: 0;
    }

    /* Lists */
    .moments-body ul,
    .moments-body ol {
        padding-left: 1.5em;
        margin: 0.75em 0;
    }

    .moments-body li {
        margin: 0.3em 0;
    }

    /* Task lists */
    .moments-body input[type="checkbox"] {
        margin-right: 0.5em;
    }

    /* Horizontal rule */
    .moments-body hr {
        border: none;
        border-top: 1px solid var(--card-separator-color);
        margin: 1.5em 0;
    }

    /* Table */
    .moments-body table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        margin: 1em 0;
    }

    .moments-body th,
    .moments-body td {
        border: 1px solid var(--table-border-color);
        padding: 0.5em 0.75em;
        text-align: left;
    }

    .moments-body th {
        background: var(--tr-even-background-color);
        font-weight: 600;
    }

    [data-scheme="dark"] .moments-body code {
        background: var(--code-background-color);
        color: rgba(255, 255, 255, 0.9);
    }

    [data-scheme="dark"] .moments-body pre {
        background: #272822;
        color: #f8f8f2;
    }

    /* States */
    .moments-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 3rem;
        color: var(--card-text-color-tertiary);
        font-size: 1.4rem;
    }

    .loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--card-separator-color);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .moments-error {
        text-align: center;
        padding: 2.5rem;
        color: #c0392b;
        font-size: 1.4rem;
        background: var(--card-background);
        border-radius: var(--card-border-radius);
        box-shadow: var(--shadow-l1);
    }

    .moments-end {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 0;
        color: var(--card-text-color-tertiary);
        font-size: 1.3rem;
    }

    .end-line {
        flex: 1;
        max-width: 60px;
        height: 1px;
        background: var(--card-separator-color);
    }

    .moments-load-more {
        text-align: center;
        padding: 1rem 0 2rem;
    }

    .moments-load-more button {
        background: var(--card-background);
        color: var(--card-text-color-secondary);
        border: 1px solid var(--card-separator-color);
        padding: 0.75rem 2rem;
        border-radius: var(--card-border-radius);
        cursor: pointer;
        font-size: 1.4rem;
        font-family: inherit;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-l1);
    }

    .moments-load-more button:hover {
        background: var(--accent-color);
        color: var(--accent-color-text);
        border-color: var(--accent-color);
        box-shadow: var(--shadow-l2);
    }

    .moments-load-more button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* Empty state */
    .moments-empty {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--card-text-color-tertiary);
        font-size: 1.5rem;
        background: var(--card-background);
        border-radius: var(--card-border-radius);
        box-shadow: var(--shadow-l1);
    }

    .moments-empty svg {
        width: 48px;
        height: 48px;
        stroke-width: 1;
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    /* Dark mode adjustments */
    [data-scheme="dark"] .moments-item:hover .moments-avatar {
        border-color: var(--accent-color);
    }

    [data-scheme="dark"] .moments-body a:hover {
        color: var(--accent-color-darker);
    }

    [data-scheme="dark"] .moments-error {
        color: #e74c3c;
    }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/monokai.min.css">

    <script type="module">
    import { marked } from 'https://esm.sh/marked@9.1.6';
    import hljs from 'https://esm.sh/highlight.js@11.9.0';

    const REPO_OWNER = 'U1traVeno';
    const REPO_NAME = 'U1traVeno.github.io';
    const CATEGORY_ID = 'DIC_kwDONsVpms4C50RQ';
    const PER_PAGE = 10;

    let endCursor = null;
    let hasNextPage = false;
    let isLoading = false;

    const listEl = document.getElementById('moments-list');
    const loadingEl = document.getElementById('moments-loading');
    const errorEl = document.getElementById('moments-error');
    const endEl = document.getElementById('moments-end');
    const loadMoreEl = document.getElementById('moments-load-more');
    const loadMoreBtn = document.getElementById('load-more-btn');

    const query = `
      query($owner: String!, $name: String!, $categoryId: ID!, $after: String) {
        repository(owner: $owner, name: $name) {
          discussions(categoryId: $categoryId, first: ${PER_PAGE}, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) {
            nodes {
              title
              body
              createdAt
              author {
                login
                avatarUrl
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
    `;

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 1) return '刚刚';
        if (diffMins < 60) return `${diffMins} 分钟前`;
        if (diffHours < 24) return `${diffHours} 小时前`;
        if (diffDays < 7) return `${diffDays} 天前`;

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function renderBody(body) {
        if (!body) return '';

        // Check if body is purely HTML (no markdown syntax), if so return as-is
        const hasMarkdown = /[#*_`~\[\]]/.test(body);
        if (!hasMarkdown) {
            return body;
        }

        // Configure marked for GFM (GitHub-Flavored Markdown)
        marked.setOptions({
            gfm: true,
            breaks: true
        });

        return marked.parse(body);
    }

    // Apply syntax highlighting after DOM is updated
    function highlightAll() {
        document.querySelectorAll('.moments-body pre code:not(.hljs)').forEach((block) => {
            hljs.highlightElement(block);
        });
    }

    function renderItem(discussion, index) {
        const author = discussion.author || { login: 'ghost', avatarUrl: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png' };
        const content = discussion.body || discussion.title;
        return `
            <article class="moments-item" style="animation-delay: ${index * 0.08}s">
                <div class="moments-meta">
                    <img class="moments-avatar" src="${author.avatarUrl}" alt="${author.login}" loading="lazy">
                    <span class="moments-author">${author.login}</span>
                    <span class="moments-date">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12,6 12,12 16,14"/>
                        </svg>
                        ${formatDate(discussion.createdAt)}
                    </span>
                </div>
                <div class="moments-body">${renderBody(content)}</div>
            </article>
        `;
    }

    const GITHUB_TOKEN = '{{ getenv "DISCUSSION_TOKEN" }}';

    async function fetchDiscussions() {
        const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...(GITHUB_TOKEN && { 'Authorization': `Bearer ${GITHUB_TOKEN}` }),
            },
            body: JSON.stringify({
                query,
                variables: {
                    owner: REPO_OWNER,
                    name: REPO_NAME,
                    categoryId: CATEGORY_ID,
                    after: endCursor
                }
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data.errors) {
            throw new Error(data.errors[0].message);
        }

        return data.data.repository.discussions;
    }

    function showError(msg) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = msg;
    }

    async function loadMoments(append = false) {
        if (isLoading) return;
        isLoading = true;

        if (!append) {
            loadingEl.style.display = 'flex';
        } else {
            loadMoreBtn.textContent = '加载中...';
            loadMoreBtn.disabled = true;
        }

        try {
            const result = await fetchDiscussions();

            if (!append) {
                loadingEl.style.display = 'none';
            }

            const items = result.nodes;
            hasNextPage = result.pageInfo.hasNextPage;
            endCursor = result.pageInfo.endCursor;

            if (!append) {
                listEl.innerHTML = '';
            }

            items.forEach((item, i) => {
                listEl.insertAdjacentHTML('beforeend', renderItem(item, i));
            });

            // Apply syntax highlighting after inserting items
            highlightAll();

            if (items.length === 0 && !append) {
                listEl.innerHTML = `
                    <div class="moments-empty">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <div>暂无内容</div>
                    </div>
                `;
            }

            if (hasNextPage && endCursor) {
                loadMoreEl.style.display = 'block';
                endEl.style.display = 'none';
            } else {
                loadMoreEl.style.display = 'none';
                if (items.length > 0) {
                    endEl.style.display = 'flex';
                }
            }
        } catch (err) {
            showError('加载失败: ' + err.message);
        } finally {
            isLoading = false;
            loadMoreBtn.textContent = '加载更多';
            loadMoreBtn.disabled = false;
        }
    }

    loadMoments();

    loadMoreBtn.addEventListener('click', () => loadMoments(true));
    </script>
</main>
{{ end }}
